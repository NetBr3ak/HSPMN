[project]
name = "hspmn"
version = "5.0.0"
description = "Nothing to Route On: hybrid Mamba-attention language model routing research"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "torch",
    "numpy",
    "triton",
    "tokenizers",
    "pyarrow",
    "reportlab",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest", "ruff==0.17.3"]

[tool.ruff]
# CI and local runs must use the same ruff: 0.17 added default rules that 0.15 never checked.
required-version = "==0.17.3"
